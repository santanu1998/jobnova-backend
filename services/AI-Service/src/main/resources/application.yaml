spring:
  application:
    name: AI-Service
  config:
    import: optional:configserver:http://localhost:8888
gemini:
  api:
    key: ${GEMINI_API_KEY}
    # gemini-3-flash-preview is the most consistently available model for this key;
    # if it is overloaded the service automatically tries the fallbacks in order.
    model: ${GEMINI_MODEL:gemini-3-flash-preview}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-3.8-flash}
    max-output-tokens: 2048
    temperature: 0.7
