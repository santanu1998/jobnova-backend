networks:
  job-portal-net:
    driver: bridge

services:

  # ============================================================
  # DATABASES  (one container per service)
  # ============================================================

  # One Postgres instance holding all six schemas. init-db.sql already creates
  # every database, so each service keeps its own logical DB while the host runs
  # a single process instead of six - this box has 2 vCPU and 4 GiB to share.
  postgres:
    restart: unless-stopped
    image: postgres:16
    container_name: job-portal-postgres
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.75
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # Named, so the data survives the "compose down" the deploy runs first.
      # The old per-service containers used anonymous volumes, which are never
      # reattached - every deploy started from an empty database.
      - pgdata:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - job-portal-net

  discovery:
    restart: unless-stopped
    image: santanu644/service-registry:latest
    container_name: job-portal-discovery
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8761 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - job-portal-net

  config-server:
    restart: unless-stopped
    image: santanu644/config-server:latest
    container_name: job-portal-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8888:8888"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8888 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - job-portal-net

  gateway:
    restart: unless-stopped
    image: santanu644/api-gateway:latest
    container_name: job-portal-gateway
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  # ============================================================
  # Kafka SERVICES
  # ============================================================

  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.1
    mem_limit: 768m
    mem_reservation: 384m
    container_name: job-portal-kafka-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    networks:
      - job-portal-net

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  user-service:
    restart: unless-stopped
    image: santanu644/user-services:latest
    container_name: job-portal-user-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5001 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5001:5001"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  company-service:
    restart: unless-stopped
    image: santanu644/company-services:latest
    container_name: job-portal-company-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5002 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5002:5002"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_company
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  job-service:
    restart: unless-stopped
    image: santanu644/job-service:latest
    container_name: job-portal-job-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5003 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5003:5003"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_job
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  application-service:
    restart: unless-stopped
    image: santanu644/application-service:latest
    container_name: job-portal-application-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5005 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1
    ports:
      - "5005:5005"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_application
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  preference-service:
    restart: unless-stopped
    image: santanu644/job-preferences:latest
    container_name: job-portal-preference-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5006 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1
    ports:
      - "5006:5006"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_preferences
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  resume-service:
    restart: unless-stopped
    image: santanu644/resume-service:latest
    container_name: job-portal-resume-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/5004 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1
    ports:
      - "5004:5004"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_portal_resume
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  ai-service:
    restart: unless-stopped
    image: santanu644/ai-service:latest
    container_name: job-portal-ai-service
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/6000 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout 5 cat <&3 | grep -q "\"status\":\"UP\""' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1
    ports:
      - "6000:6000"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    labels:
      autoheal: "true"
    networks:
      - job-portal-net

  notification-service:
    restart: unless-stopped
    image: santanu644/notification-service:latest
    container_name: job-portal-notification-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5011:5011"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.enabled=false -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    networks:
      - job-portal-net

  # Restarts any container that its own healthcheck reports as unhealthy.
  # A plain "restart:" policy only reacts to a process that has EXITED, so a
  # service that is still running but wedged (stuck DB pool, heap thrash) would
  # otherwise stay broken and keep serving 500s. Only containers carrying the
  # autoheal=true label are ever touched.
  autoheal:
    restart: unless-stopped
    image: willfarrell/autoheal:1.2.0
    container_name: job-portal-autoheal
    mem_limit: 64m
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
