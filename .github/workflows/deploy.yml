name: JobNova CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DB_PASSWORD,GEMINI_API_KEY,MAIL_USERNAME,MAIL_PASSWORD,JWT_SECRET,DUCKDNS_DOMAIN,DUCKDNS_TOKEN
          script: |
            set -e

            mkdir -p ~/jobnova-backend
            cd ~/jobnova-backend

            # The folder may already exist (created by hand) without a .git
            # directory, so turn it into a checkout instead of cloning into it.
            if [ ! -d .git ]; then
              git init -b main
              git remote add origin https://github.com/santanu1998/jobnova-backend.git
            fi
            git fetch origin main
            git checkout -f -B main origin/main

            # Keep a one-time copy of the hand-made .env before overwriting it
            cp -n .env .env.bak 2>/dev/null || true

            cat > .env <<EOF
            DB_PASSWORD=${DB_PASSWORD}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
            DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
            EOF

            docker compose -p jobnova -f docker/docker-compose.yml --env-file .env down || true
            docker compose -p jobnova -f docker/docker-compose.yml --env-file .env up -d --build
            docker compose -p jobnova -f docker/docker-compose.yml --env-file .env ps